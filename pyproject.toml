[tool.poetry]
name = "tactical_analysis_ai"
description = "TacticalAnalysisAI application."
version = "0.0.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python"
]
authors = [
  "daiha98",
  "gabrieldaiha"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
dash = "^3.0.0"
dash-player = "^1.1.0"
pandas = "^2.2.3"
numpy = "^2.2.4"
plotly = "^6.0.1"
dash-bootstrap-components = "^2.0.0"
joblib = "^1.4.2"
statsbombpy = "^1.16.0"
s3fs = "^2025.3.0"
python-dotenv = "^1.0.1"
pyarrow = "^19.0.1"
dask = "^2025.2.0"

[tool.poetry.dev-dependencies]
pre-commit = "^2.20.0"
black = "^22.6.0"
autoflake = "^2.2.1"
flake8 = "^6.1.0"
pylint = "^2.14.5"
isort = "^5.10.1"
mypy = "^1.4.1"
bandit = "^1.7.1"

[[tool.poetry.source]]
name = "PyPI"
priority = "default"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
